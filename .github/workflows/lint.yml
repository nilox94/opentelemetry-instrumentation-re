# Lint and typecheck on PRs and push to main.
# Runs when source or tooling config changes (not tests).
# Validates packaging (lockfile, build) then uses --locked for a reproducible env.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - .github/workflows/lint.yml
              - src/**
              - pyproject.toml
              - uv.lock

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      # Fail if pyproject.toml was changed without running uv lock
      - name: Check lockfile
        run: uv lock --check

      # Ensure package builds (build-backend, metadata, no missing files)
      - name: Build package
        run: uv build

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra test

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Basedpyright
        run: uv run basedpyright
