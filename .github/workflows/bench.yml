# Hot-path snapshot. On a pull request, only when the `benchmark` label is added.
# The job fails only when the script fails.

name: Benchmark

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  push:
    tags:
      - "v*"

jobs:
  bench:
    if: github.event_name != 'pull_request' || github.event.label.name == 'benchmark'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          # The PR head, not the merge commit, so the snapshot's commit line names a pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra test --extra regex --extra google-re2

      - name: Run benchmark
        run: |
          set -o pipefail
          uv run python benchmarks/bench.py | tee bench-report.txt

      - name: Publish snapshot
        run: awk 'BEGIN{p=0} /^## Snapshot/{p=1} p' bench-report.txt >> "$GITHUB_STEP_SUMMARY"
