# Install the built wheel (or sdist) into a fresh env and run tests.
# Catches "works in tree but fails when installed" and packaging mistakes.

name: Test redistribute

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - .github/workflows/test-redistribute.yml
              - src/**
              - tests/**
              - pyproject.toml
              - uv.lock

  test-redistribute:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build

      - name: Create venv and install wheel with test deps
        run: |
          uv venv .venv-redist
          wheel=$(echo dist/*.whl)
          uv pip install --python .venv-redist/bin/python "${wheel}[test,instruments]"

      - name: Run tests
        run: .venv-redist/bin/pytest tests/ -v
