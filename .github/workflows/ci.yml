# CI: lint, typecheck, and tests on PRs and push to main.
# Test results are posted to the workflow summary via pytest-results-action.
#
# Matrix: python-version × uv-resolution (highest / lowest-direct).
# lowest-direct proves compatibility with oldest allowed regex/google-re2;
# highest proves compatibility with latest releases (see FastAPI test.yml).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - .github/workflows/ci.yml
              - src/**
              - tests/**
              - pyproject.toml
              - uv.lock

  ci:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        uv-resolution: [highest, lowest-direct]
    env:
      UV_RESOLUTION: ${{ matrix.uv-resolution }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra test --extra all

      - name: Log resolved instrumented library versions
        run: |
          echo "UV_RESOLUTION=$UV_RESOLUTION"
          uv pip show regex 2>/dev/null | grep -E "^Version:" || true
          uv pip show google-re2 2>/dev/null | grep -E "^Version:" || true

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Basedpyright
        run: uv run basedpyright
        if: matrix.python-version == '3.12'

      - name: Run tests
        run: uv run pytest tests/ -v --junit-xml=test-results.xml

      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@v0.7.2
        with:
          path: test-results.xml
          summary: true
          title: Test results
