[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[project]
name = "opentelemetry-instrumentation-re"
version = "0.1.0"
description = "OpenTelemetry instrumentation for Python's re (regex) module"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Danilo Gómez", email = "danilogomez3.14@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "opentelemetry-api ~= 1.28",
    "opentelemetry-instrumentation ~= 0.49",
    "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
instruments = [
    "regex>=2021.0",
    "google-re2>=1.0",
]
regex = [
    "regex>=2021.0",
]
google-re2 = [
    "google-re2>=1.0",
]
test = [
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-test-utils>=0.49.0",
    "pytest>=7.0.0",
]
dev = [
    "basedpyright>=1.38.0",
    "prek>=0.3.0",
    "ruff>=0.1.0",
]
all = [
    "opentelemetry-instrumentation-re[instruments]",
]
build = [
    "uv>=0.4",
]

[project.entry-points."opentelemetry_instrumentor"]
re = "opentelemetry_instrumentation_re:ReInstrumentor"
regex = "opentelemetry_instrumentation_re:RegexInstrumentor"
google_re2 = "opentelemetry_instrumentation_re:GoogleRe2Instrumentor"

[project.urls]
Homepage = "https://github.com/nilox94/opentelemetry-instrumentation-re"
Repository = "https://github.com/nilox94/opentelemetry-instrumentation-re"
