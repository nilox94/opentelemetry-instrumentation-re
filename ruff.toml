# Ruff configuration for opentelemetry-instrumentation-re

target-version = "py39"
line-length = 100

[lint]
future-annotations = true
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "FA",  # flake8-annotations
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
]

ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "ARG001", # unused function argument (needed for callbacks)
    "ARG002", # unused method argument
]

[lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]  # Allow assert in tests, unused args
"src/**/__init__.py" = ["TCH001", "TCH002"]  # Allow type-only imports when using from __future__ import annotations

[lint.isort]
known-first-party = ["opentelemetry_instrumentation_re"]

[lint.mccabe]
max-complexity = 10

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
